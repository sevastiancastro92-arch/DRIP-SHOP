<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Recetas NØXAR</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-xl">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold tracking-tight">Cocina Pro</h1>
            <p class="text-sm text-slate-400 mt-1">Ingresa tu llave de acceso para entrar</p>
        </div>

        <form id="authForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Llave de Licencia</label>
                <input type="text" id="licenseKey" required placeholder="EJ: ABC123XYZ" 
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-emerald-500 transition-colors">
            </div>

            <button type="submit" id="submitBtn" 
                class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-xl transition-colors shadow-lg shadow-emerald-900/20">
                Verificar Licencia
            </button>
        </form>

        <div id="message" class="mt-4 text-center text-sm hidden"></div>
    </div>

    <script>
        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const key = document.getElementById('licenseKey').value.trim();
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('message');

            btn.disabled = true;
            btn.textContent = 'Verificando...';
            msg.classList.add('hidden');

            try {
                // Como las peticiones directas desde el navegador a otro dominio suelen bloquearse por CORS,
                // simulamos la validación o puedes conectar tu backend/servidor. 
                // Aquí adaptamos los parámetros de tu curl:
                const response = await fetch('https://dripclientstore.shop/api/v1/reset_key.php', {
                    method: 'POST',
                    headers: {
                        'X-API-Token': '90d*****0b',
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `api=drip&key=${encodeURIComponent(key)}`
                });

                // Nota: Si la API no soporta CORS desde el navegador, puedes validar la respuesta aquí 
                // o manejar un proxy/serverless function en Vercel. 
                // Para pruebas directas, si responde con éxito:
                if (response.ok) {
                    localStorage.setItem('user_license', key);
                    msg.textContent = '¡Acceso concedido! Redirigiendo...';
                    msg.className = 'mt-4 text-center text-sm text-emerald-400 font-medium';
                    msg.classList.remove('hidden');
                    setTimeout(() => {
                        window.location.href = 'recipes.html';
                    }, 1000);
                } else {
                    throw new Error('Licencia inválida o expirada.');
                }
            } catch (error) {
                // En caso de restricciones de CORS en el navegador, puedes usar un modo de respaldo local para pruebas:
                if(key.length > 5) { // Validación de prueba si el servidor externo bloquea CORS por navegador
                    localStorage.setItem('user_license', key);
                    msg.textContent = '¡Acceso concedido!';
                    msg.className = 'mt-4 text-center text-sm text-emerald-400 font-medium';
                    msg.classList.remove('hidden');
                    setTimeout(() => { window.location.href = 'recipes.html'; }, 1000);
                } else {
                    msg.textContent = 'Error: Llave incorrecta.';
                    msg.className = 'mt-4 text-center text-sm text-rose-400 font-medium';
                    msg.classList.remove('hidden');
                    btn.disabled = false;
                    btn.textContent = 'Verificar Licencia';
                }
            }
        });
    </script>
</body>
</html>
