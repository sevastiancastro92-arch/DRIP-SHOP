<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Recetas</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

    <!-- Navbar -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <h1 class="font-bold text-lg text-emerald-400">Recetas Pro</h1>
            <button onclick="logout()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 transition-colors">
                Cerrar Sesión
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-8">
        <div class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h2 class="text-3xl font-extrabold tracking-tight">Catálogo Culinario</h2>
                <p class="text-slate-400 text-sm mt-1">Selecciona una receta para ver sus ingredientes y preparación.</p>
            </div>
            <input type="text" id="searchInput" placeholder="Buscar receta..." 
                class="bg-slate-900 border border-slate-800 px-4 py-2 rounded-xl text-sm focus:outline-none focus:border-emerald-500 w-full md:w-72">
        </div>

        <!-- Grid de Recetas -->
        <div id="recipesGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Las recetas se inyectan dinámicamente -->
        </div>
    </main>

    <!-- Modal de Receta -->
    <div id="recipeModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 max-w-lg w-full rounded-2xl p-6 relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white">&times;</button>
            <h3 id="modalTitle" class="text-xl font-bold mb-2"></h3>
            <p id="modalCategory" class="text-xs text-emerald-400 font-semibold uppercase tracking-wider mb-4"></p>
            
            <div class="space-y-4 text-sm text-slate-300">
                <div>
                    <h4 class="font-semibold text-slate-200 mb-1">Ingredientes:</h4>
                    <ul id="modalIngredients" class="list-disc list-inside space-y-1 text-slate-400"></ul>
                </div>
                <div>
                    <h4 class="font-semibold text-slate-200 mb-1">Preparación:</h4>
                    <p id="modalInstructions" class="text-slate-400 leading-relaxed"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Proteger ruta si no hay key
        if (!localStorage.getItem('user_license')) {
            window.location.href = 'index.html';
        }

        const recipes = [
            {
                id: 1,
                title: "Pasta Carbonara Italiana",
                category: "Almuerzo",
                image: "https://images.unsplash.com/photo-1612874742237-6526221588e3?auto=format&fit=crop&w=600&q=80",
                ingredients: ["Spaghetti", "Pancetta o Guanciale", "Huevos", "Queso Pecorino Romano", "Pimienta negra"],
                instructions: "Cocina la pasta al dente. Dorar la pancetta en una sartén. Mezcla los huevos con el queso rallado y abundante pimienta. Une todo fuera del fuego con un chorrito de agua de cocción para crear una crema sedosa."
            },
            {
                id: 2,
                title: "Pancakes Fluffy de Arándanos",
                category: "Desayuno",
                image: "https://images.unsplash.com/photo-1567620905732-2d1ec7ab7445?auto=format&fit=crop&w=600&q=80",
                ingredients: ["Harina de trigo", "Polvo de hornear", "Leche", "Huevo", "Azúcar", "Arándanos frescos"],
                instructions: "Mezcla los ingredientes secos por un lado y los húmedos por otro. Combina sin batir en exceso para mantener el aire. Agrega los arándanos y cocina en sartén antiadherente a fuego medio hasta dorar ambos lados."
            },
            {
                id: 3,
                title: "Ensalada César con Pollo",
                category: "Cena Ligera",
                image: "https://images.unsplash.com/photo-1550304943-4f24f54ddde9?auto=format&fit=crop&w=600&q=80",
                ingredients: ["Lechuga romana", "Pechuga de pollo a la plancha", "Picatostes (croutons)", "Queso parmesano", "Aderezo César"],
                instructions: "Lava y corta la lechuga romana. Añade el pollo cortado en tiras, los picatostes y las lascas de queso parmesano. Baña con el aderezo César al momento de servir."
            }
        ];

        const grid = document.getElementById('recipesGrid');

        function renderRecipes(items) {
            grid.innerHTML = items.map(r => `
                <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden group cursor-pointer hover:border-slate-700 transition-all" onclick="openModal(${r.id})">
                    <div class="h-48 overflow-hidden">
                        <img src="${r.image}" alt="${r.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                    </div>
                    <div class="p-5">
                        <span class="text-xs font-semibold text-emerald-400 uppercase tracking-wider">${r.category}</span>
                        <h3 class="font-bold text-lg mt-1">${r.title}</h3>
                    </div>
                </div>
            `).join('');
        }

        function openModal(id) {
            const r = recipes.find(item => item.id === id);
            document.getElementById('modalTitle').textContent = r.title;
            document.getElementById('modalCategory').textContent = r.category;
            document.getElementById('modalIngredients').innerHTML = r.ingredients.map(i => `<li>${i}</li>`).join('');
            document.getElementById('modalInstructions').textContent = r.instructions;
            document.getElementById('recipeModal').classList.remove('hidden');
            document.getElementById('recipeModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('recipeModal').classList.add('hidden');
            document.getElementById('recipeModal').classList.remove('flex');
        }

        function logout() {
            localStorage.removeItem('user_license');
            window.location.href = 'index.html';
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = recipes.filter(r => r.title.toLowerCase().includes(term) || r.category.toLowerCase().includes(term));
            renderRecipes(filtered);
        });

        renderRecipes(recipes);
    </script>
</body>
</html>
