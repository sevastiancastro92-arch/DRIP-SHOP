<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NØXAR Store - Tienda de Licencias</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-[#080510] text-[#f3f1fa] min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="border-b border-purple-900/30 bg-[#0e0825]/50 backdrop-blur-md p-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-lg font-extrabold bg-gradient-to-r from-white via-purple-300 to-fuchsia-500 bg-clip-text text-transparent">
                <i class="fas fa-store text-fuchsia-500 mr-2"></i> NØXAR STORE
            </h1>
            <div class="flex items-center gap-4">
                <div class="bg-purple-950/40 border border-purple-900/60 px-3 py-1 rounded-lg text-xs font-mono">
                    Saldo: <span id="user-balance" class="text-emerald-400 font-bold">$0.00</span>
                </div>
                <button id="logout-btn" class="text-xs text-red-400 hover:text-red-300 cursor-pointer">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto p-4 w-full flex-grow">
        <div class="mb-6 text-center">
            <h2 class="text-2xl font-bold mb-1">Catálogo de Licencias</h2>
            <p class="text-xs text-purple-300/70">Selecciona el producto que deseas adquirir.</p>
        </div>

        <p id="catalog-status" class="mb-3 text-center text-xs text-purple-200/60" aria-live="polite">Cargando variantes y precios…</p>
        <div id="product-list" class="mb-6 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>

        <!-- Resultado -->
        <div id="resultado-container" class="hidden bg-emerald-950/30 border border-emerald-500/40 p-4 rounded-xl">
            <h3 class="text-emerald-400 font-bold text-xs uppercase tracking-wider mb-2"><i class="fas fa-check-circle mr-1"></i> ¡Key Generada con Éxito!</h3>
            <div id="keys-box" class="space-y-2 font-mono text-xs bg-black/40 p-3 rounded-lg border border-emerald-500/20 text-emerald-300 select-all"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center text-[10px] text-gray-500 p-4 border-t border-purple-900/20">
        <span>NØXAR Mods &copy; 2026 — Todos los derechos reservados.</span>
        <a href="/admin.html" class="ml-3 text-purple-300/60 hover:text-purple-200">Administración</a>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCEM7fa1Erl2NLpM8VTRYCVyHW-cl-JEjw",
          authDomain: "sociosxit-fa932.firebaseapp.com",
          databaseURL: "https://sociosxit-fa932-default-rtdb.firebaseio.com",
          projectId: "sociosxit-fa932",
          storageBucket: "sociosxit-fa932.firebasestorage.app",
          messagingSenderId: "942961938934",
          appId: "1:942961938934:web:8f9e5620253d122a9e77d7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const variantIds = [9, 76, 10, 11, 12, 182, 184, 181, 183, 217, 13, 14, 15];

        let currentUser = null;

        async function refreshBalance() {
            if (!currentUser) return;
            const snapshot = await get(ref(db, 'users/' + currentUser.uid));
            const balance = Number(snapshot.val()?.balance || 0);
            document.getElementById('user-balance').innerText = `$${balance.toFixed(2)}`;
        }

        async function loadCatalog() {
            const status = document.getElementById('catalog-status');
            const list = document.getElementById('product-list');
            try {
                const response = await fetch('/api/prices', { cache: 'no-store' });
                const data = await response.json();
                if (!response.ok || data.success === false) throw new Error(data.error || 'Precios no disponibles');
                list.replaceChildren();
                for (const variantId of variantIds) {
                    const salePrice = Number(data.salePrices?.[variantId]);
                    const hasPrice = Number.isFinite(salePrice) && salePrice > 0;
                    const card = document.createElement('article');
                    card.className = 'rounded-xl border border-purple-900/40 bg-purple-950/20 p-4 transition hover:border-fuchsia-500/40';
                    const badge = document.createElement('span');
                    badge.className = 'rounded bg-purple-500/20 px-2 py-1 font-mono text-[10px] text-purple-200';
                    badge.textContent = `Variant ID: ${variantId}`;
                    const title = document.createElement('h3');
                    title.className = 'mt-3 text-sm font-bold';
                    title.textContent = `Variante ${variantId}`;
                    const description = document.createElement('p');
                    description.className = 'mt-1 text-xs text-gray-400';
                    description.textContent = 'Key digital · prueba de catálogo';
                    const price = document.createElement('p');
                    price.className = 'mt-4 text-lg font-extrabold text-white';
                    price.textContent = hasPrice ? `$${salePrice.toFixed(2)}` : 'Precio pendiente';
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.disabled = !hasPrice;
                    button.className = 'mt-3 w-full rounded-lg bg-gradient-to-r from-purple-700 to-fuchsia-600 py-2.5 text-xs font-bold text-white transition hover:brightness-110 disabled:cursor-not-allowed disabled:opacity-40';
                    button.innerHTML = hasPrice ? '<i class="fas fa-bolt mr-1"></i> Comprar Key' : 'Configurar precio en admin';
                    button.addEventListener('click', () => window.comprarKey(variantId, button));
                    card.append(badge, title, description, price, button);
                    list.append(card);
                }
                status.textContent = '13 variantes de prueba · nombres reales pendientes del catálogo del proveedor';
            } catch (error) {
                status.textContent = 'No se pudieron cargar los precios. Reintenta al actualizar la página.';
                console.error('No se pudo cargar el catálogo de precios', error);
            }
        }

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'login.html';
            } else {
                currentUser = user;
                await refreshBalance();
            }
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth).then(() => { window.location.href = 'login.html'; });
        });

        loadCatalog();

        window.comprarKey = async function(variantId, btn) {
            if (!currentUser) {
                window.location.href = 'login.html';
                return;
            }
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Procesando...';
            btn.disabled = true;

            try {
                const idToken = await currentUser.getIdToken();
                const res = await fetch('/api/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${idToken}`
                    },
                    body: JSON.stringify({ variant_id: variantId, quantity: 1 })
                });

                const data = await res.json();
                const container = document.getElementById('resultado-container');
                const box = document.getElementById('keys-box');

                if (data.success !== false && data.keys) {
                    box.replaceChildren(...data.keys.map((key) => {
                        const line = document.createElement('div');
                        line.textContent = `🔑 ${key}`;
                        return line;
                    }));
                    container.classList.remove('hidden');
                    refreshBalance().catch((error) => console.error('No se pudo refrescar el saldo mostrado', error));
                } else {
                    const followUp = data.order_id ? ` Referencia: ${data.order_id}. No repitas la compra hasta revisar esta orden.` : '';
                    alert((data.error || 'No se pudo generar la key') + followUp);
                }
            } catch (e) {
                alert('Error de red al conectar con el servidor.');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
