<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Key System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold tracking-tight text-white">Reset Key Panel</h1>
            <p class="text-xs text-slate-400 mt-1">Restablece HWID / Licencias de Drip</p>
        </div>

        <form id="resetForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">License Key</label>
                <input type="text" id="licenseKey" required placeholder="Ingresa la key a restablecer" 
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-emerald-500 transition-colors font-mono text-sm">
            </div>

            <button type="submit" id="btnSubmit" 
                class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-xl transition-colors shadow-lg shadow-emerald-900/20">
                Solicitar Reset
            </button>
        </form>

        <div id="resultBox" class="mt-5 p-4 rounded-xl border border-slate-800 bg-slate-950 hidden">
            <p class="text-xs font-semibold text-slate-400 uppercase mb-1">Respuesta:</p>
            <pre id="resultText" class="text-xs font-mono text-slate-200 whitespace-pre-wrap break-all"></pre>
        </div>
    </div>

    <script>
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const keyInput = document.getElementById('licenseKey').value.trim();
            const btn = document.getElementById('btnSubmit');
            const resultBox = document.getElementById('resultBox');
            const resultText = document.getElementById('resultText');

            btn.disabled = true;
            btn.textContent = 'Procesando...';
            resultBox.classList.add('hidden');

            try {
                const res = await fetch('/api/reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key: keyInput })
                });

                const data = await res.json();
                resultBox.classList.remove('hidden');

                if (data.success) {
                    resultText.textContent = data.response;
                    resultText.className = "text-xs font-mono text-emerald-400 whitespace-pre-wrap break-all";
                } else {
                    resultText.textContent = data.message || 'Error al procesar la solicitud.';
                    resultText.className = "text-xs font-mono text-rose-400 whitespace-pre-wrap break-all";
                }

            } catch (err) {
                resultBox.classList.remove('hidden');
                resultText.textContent = 'Error al conectar con la Vercel Serverless Function.';
                resultText.className = "text-xs font-mono text-rose-400 whitespace-pre-wrap break-all";
            } finally {
                btn.disabled = false;
                btn.textContent = 'Solicitar Reset';
            }
        });
    </script>
</body>
</html>
